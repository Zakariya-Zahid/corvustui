name: Bug report
description: Report a reproducible problem with CorvusTUI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, tokens, `.env` contents, or private file
        contents. Redact logs before pasting them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command or TUI actions.
      placeholder: |
        1. Run ...
        2. Press ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, terminal, and whether you are in tmux/SSH.
      placeholder: "Ubuntu 24.04, Python 3.14, Kitty, no tmux"
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      description: Do not include the API key.
      placeholder: "ollama / qwen3.5:0.8b"

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - TUI
        - Providers
        - MCP
        - Safety
        - Memory / RAG
        - Packaging / install
        - Documentation
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or traceback
      render: shell
