name: Feature request
description: Propose a feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want, not only the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - TUI
        - Providers
        - MCP
        - Safety
        - Memory / RAG
        - Sessions
        - Multimodal
        - Packaging / install
        - Documentation
        - Other

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Small (one module)
        - Medium (multiple modules)
        - Large (new subsystem or public interface)
        - Not sure

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Link related issues, roadmap phases, or examples.
