[project]
name = "corvustui"
version = "0.1.0"
description = "CorvusTUI: Agentic Terminal Interface and Modular MCP Execution Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "click>=8.1",
    "ddgs>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "textual>=0.70",
]
rag = [
    "chromadb>=0.5",
]
tui = [
    "textual>=0.70",
    "textual-dev>=0.70",
]
web = [
    "tavily-python>=0.3",
    "ddgs>=0.10",
]
# MCP is implemented in-tree (JSON-RPC client + stdio/HTTP transports), so it
# needs no optional dependency.
all = ["corvustui[rag,tui,web]"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corvustui.tui" = ["styles/*.tcss"]

[project.scripts]
corvustui = "corvustui.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false